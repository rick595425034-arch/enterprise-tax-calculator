<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业税务计算器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f0f2f5; color: #222; font-size: 14px; }
.wrap { max-width: 820px; margin: 24px auto; padding: 0 16px 60px; }
h1 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #111; }

.card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.card-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media(max-width:520px){ .grid2,.grid3 { grid-template-columns: 1fr; } }

.field { }
.field label { display: block; color: #555; margin-bottom: 5px; font-size: 13px; }
.field input[type=number], .field select {
  width: 100%; padding: 9px 11px; border: 1.5px solid #e0e0e0;
  border-radius: 8px; font-size: 14px; outline: none; background: #fafafa;
  transition: border-color .15s;
}
.field input[type=number]:focus, .field select:focus { border-color: #1677ff; background: #fff; }
.field .sub { font-size: 11px; color: #aaa; margin-top: 3px; }

.radios { display: flex; gap: 16px; margin-top: 6px; }
.radios label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; }

.btn {
  display: block; width: 100%; padding: 14px;
  background: #1677ff; color: #fff; border: none;
  border-radius: 10px; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 6px; letter-spacing: .5px;
}
.btn:active { background: #0e5fd8; }

/* 结果区 */
#result { display: none; margin-top: 14px; }
.result-card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.result-card h3 { font-size: 14px; font-weight: 600; color: #1677ff; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e8f0fe; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: #f7f9fc; padding: 9px 12px; text-align: left; color: #666; font-weight: 500; font-size: 13px; }
td { padding: 9px 12px; border-bottom: 1px solid #f3f3f3; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.label { color: #555; }
tr.sub-row td { color: #888; font-size: 13px; padding-left: 20px; }
tr.sub-row td:first-child::before { content: '└ '; }
tr.section td { font-weight: 600; background: #f7f9fc; color: #333; }
tr.total-row td { font-weight: 700; font-size: 15px; color: #1677ff; background: #eef4ff; }
tr.profit-row td { font-weight: 700; font-size: 15px; color: #389e0d; background: #f6ffed; }
tr.rate-row td { color: #888; font-size: 13px; }
.tag-yes { color: #389e0d; font-weight: 600; }
.tag-no  { color: #cf1322; font-weight: 600; }
.zero { color: #ccc; }
.input-toggle { display: flex; align-items: center; gap: 8px; }
.input-toggle input { flex: 1; }
.toggle-btns { display: flex; border: 1.5px solid #e0e0e0; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.tog { padding: 9px 14px; border: none; background: #fafafa; color: #888; font-size: 13px; cursor: pointer; transition: all .15s; }
.tog:first-child { border-right: 1px solid #e0e0e0; }
.tog.active { background: #1677ff; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>企业税务汇总计算器</h1>

  <!-- 基础数据 -->
  <div class="card">
    <div class="card-title">基础数据</div>
    <div style="margin-bottom:12px">
      <div class="field">
        <label>营业收入</label>
        <div class="input-toggle">
          <input type="number" id="income" placeholder="如：1000000" min="0">
          <div class="toggle-btns" id="incomeType">
            <button type="button" class="tog active" data-val="tax">含税</button>
            <button type="button" class="tog" data-val="notax">不含税</button>
          </div>
        </div>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div class="field">
        <label>营业成本</label>
        <div class="input-toggle">
          <input type="number" id="cost" placeholder="如：500000" min="0">
          <div class="toggle-btns" id="costType">
            <button type="button" class="tog active" data-val="tax">含税</button>
            <button type="button" class="tog" data-val="notax">不含税</button>
          </div>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>期间费用（管理/销售/财务）</label>
        <input type="number" id="expense" placeholder="如：150000" min="0">
        <div class="sub">不含增值税，直接填写</div>
      </div>
    </div>
  </div>

  <!-- 税率参数 -->
  <div class="card">
    <div class="card-title">税率参数</div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field">
        <label>纳税人类型</label>
        <select id="vatPayer">
          <option value="general">一般纳税人</option>
          <option value="small">小规模纳税人</option>
        </select>
      </div>
      <div class="field">
        <label>增值税率</label>
        <select id="vatRate">
          <option value="0.13">13%（货物/加工）</option>
          <option value="0.09">9%（不动产/运输）</option>
          <option value="0.06">6%（服务/无形资产）</option>
          <option value="0.03">3%（小规模）</option>
          <option value="0.01">1%（小规模优惠）</option>
        </select>
      </div>
      <script>
      // 纳税人类型联动增值税率
      document.getElementById('vatPayer').addEventListener('change', function() {
        var rateEl = document.getElementById('vatRate');
        var isSmall = this.value === 'small';
        Array.from(rateEl.options).forEach(function(opt) {
          var v = parseFloat(opt.value);
          if (isSmall) {
            opt.hidden = v > 0.03;
          } else {
            opt.hidden = v <= 0.03;
          }
        });
        // 重置到第一个可见选项
        var first = Array.from(rateEl.options).find(function(o){ return !o.hidden; });
        if (first) rateEl.value = first.value;
      });
      // 初始化触发一次
      document.getElementById('vatPayer').dispatchEvent(new Event('change'));
      </script>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field">
        <label>所在地区（城建税）</label>
        <select id="cbtRate">
          <option value="0.07">市区 7%</option>
          <option value="0.05">县城/镇 5%</option>
          <option value="0.01">其他 1%</option>
        </select>
      </div>
      <div class="field">
        <label>企业所得税类型</label>
        <select id="citType">
          <option value="auto">自动判断（小微/标准）</option>
          <option value="0.25">标准企业 25%</option>
          <option value="0.15">高新技术企业 15%</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>印花税合同类型</label>
        <select id="stampType">
          <option value="0.0003">购销合同 0.03%</option>
          <option value="0.0005">借款合同 0.05%</option>
          <option value="0.001">租赁/保险合同 0.1%</option>
          <option value="0.00025">技术合同 0.025%</option>
        </select>
      </div>
      <div class="field">
        <label>印花税计税比例</label>
        <select id="stampRatio">
          <option value="1">收入全额</option>
          <option value="0.8">收入+成本×80%</option>
          <option value="0.7">收入+成本×70%</option>
          <option value="0.5">收入+成本×50%</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="calcBtn">立即计算</button>

  <!-- 结果 -->
  <div id="result">

    <!-- 基础数据还原 -->
    <div class="result-card">
      <h3>基础数据（还原）</h3>
      <table>
        <tr><td class="label">营业收入（含税）</td><td class="num" id="r-incomeT">-</td></tr>
        <tr><td class="label">营业收入（不含税）</td><td class="num" id="r-incomeN">-</td></tr>
        <tr><td class="label">营业成本（含税）</td><td class="num" id="r-costT">-</td></tr>
        <tr><td class="label">营业成本（不含税）</td><td class="num" id="r-costN">-</td></tr>
        <tr><td class="label">期间费用</td><td class="num" id="r-expense">-</td></tr>
      </table>
    </div>

    <!-- 增值税 -->
    <div class="result-card">
      <h3>增值税</h3>
      <table>
        <tr><td class="label">销项税额</td><td class="num" id="r-vatOut">-</td></tr>
        <tr><td class="label">进项税额</td><td class="num" id="r-vatIn">-</td></tr>
        <tr class="total-row"><td>应交增值税</td><td class="num" id="r-vat">-</td></tr>
      </table>
    </div>

    <!-- 附加税 -->
    <div class="result-card">
      <h3>附加税费</h3>
      <table>
        <tr><td class="label" id="r-cbtLabel">城市维护建设税</td><td class="num" id="r-cbt">-</td></tr>
        <tr><td class="label">教育费附加（3%）</td><td class="num" id="r-edu">-</td></tr>
        <tr><td class="label">地方教育附加（2%）</td><td class="num" id="r-ledu">-</td></tr>
        <tr class="total-row"><td>附加税合计</td><td class="num" id="r-addTotal">-</td></tr>
      </table>
    </div>

    <!-- 印花税 -->
    <div class="result-card">
      <h3>印花税</h3>
      <table>
        <tr><td class="label">计税依据</td><td class="num" id="r-stampBase">-</td></tr>
        <tr class="total-row"><td>应交印花税</td><td class="num" id="r-stamp">-</td></tr>
      </table>
    </div>

    <!-- 企业所得税 -->
    <div class="result-card">
      <h3>企业所得税</h3>
      <table>
        <tr><td class="label">利润总额（不含税口径）</td><td class="num" id="r-profit0">-</td></tr>
        <tr><td class="label">应纳税所得额</td><td class="num" id="r-citBase">-</td></tr>
        <tr><td class="label">适用税率</td><td class="num" id="r-citRate">-</td></tr>
        <tr class="total-row"><td>应交企业所得税</td><td class="num" id="r-cit">-</td></tr>
      </table>
    </div>

    <!-- 汇总 -->
    <div class="result-card">
      <h3>税款汇总</h3>
      <table>
        <tr><td class="label">增值税</td><td class="num" id="s-vat">-</td></tr>
        <tr><td class="label">附加税合计</td><td class="num" id="s-add">-</td></tr>
        <tr><td class="label">印花税</td><td class="num" id="s-stamp">-</td></tr>
        <tr><td class="label">企业所得税</td><td class="num" id="s-cit">-</td></tr>
        <tr class="total-row"><td>税款合计</td><td class="num" id="s-total">-</td></tr>
        <tr class="profit-row"><td>税后净利润</td><td class="num" id="s-net">-</td></tr>
        <tr class="rate-row"><td>综合税负率（占不含税收入）</td><td class="num" id="s-rate">-</td></tr>
      </table>
    </div>

  </div>
</div>
